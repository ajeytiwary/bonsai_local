[project]
name = "bonsai-local-agent"
version = "0.2.0"
description = "Persistent, benchmarked and evolution-ready local coding agent for Bonsai/llama.cpp"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
readme = "README.md"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
evolution = ["dspy>=3.0","gepa>=0.1"]
[project.scripts]
bonsai-agent = "bonsai_agent.cli:main"
bonsai-bench = "bonsai_agent.benchmark:main"
bonsai-evolve = "bonsai_agent.evolution:main"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["bonsai_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
