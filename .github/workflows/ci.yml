name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q bonsai_agent
      - run: python benchmarks/generate_fixtures.py
      - run: python -m pytest -q
      - name: Validate benchmark manifest
        run: python -c "import json,pathlib; d=json.load(open('benchmarks/tasks.json')); assert len(d['tasks'])==40; assert {x['split'] for x in d['tasks']}=={'train','val','test'}; assert all(pathlib.Path(x['fixture']).exists() for x in d['tasks'])"
